<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N28 Character Codex - Joustline</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1b1426;color:#f3eadb}
h1{text-align:center;padding:16px;margin:0;font-size:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px;max-width:720px;margin:auto}
.card{background:#2c2240;border:2px solid #c9a24a;border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-size:1rem;color:inherit}
.card span{font-size:2.4rem;display:block}
#profile{display:none;max-width:560px;margin:12px auto;padding:16px;background:#2c2240;border-radius:10px}
button.back{background:#c9a24a;border:0;padding:10px 16px;border-radius:6px;font-weight:bold}
</style>
</head>
<body>
<h1>Joustline Character Codex</h1>
<div class="grid" id="grid"></div>
<div id="profile" role="dialog"><h2 id="pname"></h2><p id="prole"></p><p id="pbio"></p><button class="back" id="back">Back to grid</button></div>
<script>
// N28 draft: placeholder characters until Stonewall confirms the roster.
var chars=[
 {icon:"🛡️",name:"Sir Aldric",role:"Champion knight",bio:"Undefeated in the lists, sworn to the crown."},
 {icon:"🏹",name:"Lady Wren",role:"Archer and scout",bio:"Reads the field before anyone rides."},
 {icon:"🐎",name:"Brannoc",role:"Squire",bio:"Tends the horses and dreams of his first joust."}
];
var g=document.getElementById("grid"),p=document.getElementById("profile");
chars.forEach(function(c){var b=document.createElement("button");b.className="card";
 b.innerHTML="<span>"+c.icon+"</span>"+c.name;b.onclick=function(){
 document.getElementById("pname").textContent=c.icon+" "+c.name;
 document.getElementById("prole").textContent=c.role;
 document.getElementById("pbio").textContent=c.bio;g.style.display="none";p.style.display="block";};g.appendChild(b);});
document.getElementById("back").onclick=function(){p.style.display="none";g.style.display="grid";};
</script>
</body>
</html>
