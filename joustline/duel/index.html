<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N29 Jousting Duel v2</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1b1430;color:#f4efe6;display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh;box-sizing:border-box}
h1{font-size:1.4rem;margin:8px 0}
.arena{display:flex;gap:12px;width:100%;max-width:520px;justify-content:space-between}
.knight{flex:1;background:#2c2250;border-radius:12px;padding:12px;text-align:center}
.knight .icon{font-size:3rem}
.hp{height:12px;background:#444;border-radius:6px;overflow:hidden;margin-top:8px}
.hp div{height:100%;background:#4caf50;transition:width .3s}
#log{margin:12px 0;min-height:3em;text-align:center;max-width:520px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font-size:1rem;padding:12px 16px;border:0;border-radius:10px;background:#e0a526;color:#1b1430;font-weight:700;min-width:96px}
button:disabled{opacity:.4}
#winner{font-size:1.3rem;font-weight:800;margin:10px 0;color:#ffd54f}
</style>
</head>
<body>
<h1>Jousting Duel v2</h1>
<div class="arena">
 <div class="knight"><div class="icon">🛡️</div><div>Sir Blue (you)</div><div class="hp"><div id="hp0" style="width:100%"></div></div><div id="s0">Score: 0</div></div>
 <div class="knight"><div class="icon">⚔️</div><div>Sir Red</div><div class="hp"><div id="hp1" style="width:100%"></div></div><div id="s1">Score: 0</div></div>
</div>
<div id="log">Choose your aim. High beats Low, Low beats Shield, Shield beats High.</div>
<div id="winner"></div>
<div class="btns" id="moves">
 <button data-m="high">Aim High</button><button data-m="low">Aim Low</button><button data-m="shield">Shield</button>
</div>
<div class="btns" style="margin-top:10px"><button id="replay" hidden>Replay</button></div>
<script>
(function(){
var MAX=3,hp=[MAX,MAX],score=[0,0],over=false;
var beats={high:"low",low:"shield",shield:"high"};
var moves=["high","low","shield"];
function $(id){return document.getElementById(id)}
function draw(){for(var i=0;i<2;i++){$("hp"+i).style.width=(hp[i]/MAX*100)+"%";$("s"+i).textContent="Score: "+score[i]}}
function setBtns(d){document.querySelectorAll("#moves button").forEach(function(b){b.disabled=d})}
function pass(m){
 if(over)return;
 var ai=moves[Math.floor(Math.random()*3)],msg="You: "+m+" vs Red: "+ai+". ";
 if(m===ai)msg+="Lances glance off. No hit.";
 else if(beats[m]===ai){hp[1]--;score[0]++;msg+="You unseat Red's guard!"}
 else{hp[0]--;score[1]++;msg+="Red strikes you!"}
 $("log").textContent=msg;draw();
 if(hp[0]<=0||hp[1]<=0){over=true;$("winner").textContent=hp[1]<=0?"Winner: Sir Blue (you)!":"Winner: Sir Red!";setBtns(true);$("replay").hidden=false}
}
function reset(){hp=[MAX,MAX];score=[0,0];over=false;$("winner").textContent="";$("log").textContent="New round. Choose your aim.";$("replay").hidden=true;setBtns(false);draw()}
document.querySelectorAll("#moves button").forEach(function(b){b.addEventListener("click",function(){pass(b.dataset.m)})});
$("replay").addEventListener("click",reset);
draw();
})();
</script>
</body>
</html>
