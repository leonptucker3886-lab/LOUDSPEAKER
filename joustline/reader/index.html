<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joustline: Chapter Reader</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#1b1712;color:#f3e9d2}
main{max-width:640px;margin:0 auto;padding:20px}
h1{font-size:1.1rem;color:#d9b45a;margin:0 0 4px}h2{font-size:1.4rem;margin:0 0 12px}
#page{line-height:1.6;font-size:1.1rem;min-height:40vh}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
button{font-size:1rem;padding:14px 20px;min-width:110px;border:0;border-radius:8px;background:#d9b45a;color:#1b1712;cursor:pointer}
button:disabled{opacity:.35;cursor:default}#count{font-size:.9rem}
</style></head><body><main>
<h1>Joustline</h1><h2>Chapter 1: The Lists at Dawn</h2>
<div id="page"></div>
<nav><button id="prev">Previous</button><span id="count"></span><button id="next">Next</button></nav>
</main><script>
var pages=[
"Mist lay over the tilting yard as the heralds raised their banners. Sir Aldric checked his lance twice, as his father had taught him.",
"Across the lists, the Black Knight waited, motionless. No one in the stands knew his name, only that he had never been unhorsed.",
"The trumpet sounded. Aldric lowered his visor, set his spurs, and rode toward the first pass of the day."
];
var i=0,p=document.getElementById('page'),c=document.getElementById('count'),pr=document.getElementById('prev'),nx=document.getElementById('next');
function show(){p.textContent=pages[i];c.textContent='Page '+(i+1)+' of '+pages.length;pr.disabled=i===0;nx.disabled=i===pages.length-1;}
pr.onclick=function(){if(i>0){i--;show();}};nx.onclick=function(){if(i<pages.length-1){i++;show();}};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')pr.onclick();if(e.key==='ArrowRight')nx.onclick();});
show();
</script></body></html>
