<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QR Code Studio (demo) – White-label</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#FAFAF9;color:#18181B}main{max-width:560px;margin:0 auto;padding:24px}h1{font-size:1.6rem}input,button{font-size:1rem;padding:10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}input{width:100%}button{background:#2A78D6;color:#fff;border:0;margin-top:10px;cursor:pointer}#qr{margin:20px 0;display:flex;justify-content:center;background:#fff;padding:16px;border-radius:12px}.tag{font-size:.8rem;background:#DEDDD8;padding:2px 8px;border-radius:99px}a.cta{display:inline-block;margin-top:16px;color:#2A78D6}</style></head>
<body><main><span class="tag">Demo mode</span><h1>QR Code Studio</h1><p>Turn any link or text into a QR code you can download as a PNG. Runs in your browser.</p>
<label for="t">URL or text</label><input id="t" value="https://loudspeaker-roan.vercel.app/white-label/">
<button id="g">Generate</button> <button id="d">Download PNG</button>
<div id="qr"></div><a class="cta" href="/white-label/">White-label this tool →</a></main>
<script>var q=new QRCode(document.getElementById('qr'),{width:256,height:256});function gen(){q.clear();q.makeCode(document.getElementById('t').value||' ')}
document.getElementById('g').onclick=gen;document.getElementById('d').onclick=function(){var c=document.querySelector('#qr canvas');var a=document.createElement('a');a.download='qr-code.png';a.href=c.toDataURL('image/png');a.click()};gen();</script></body></html>
