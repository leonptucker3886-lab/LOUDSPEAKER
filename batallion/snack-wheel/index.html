<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Picker Wheel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1b1430;color:#fff;display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh}
h1{margin:8px 0 12px;font-size:1.6rem}
.wrap{position:relative;width:min(90vw,380px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid #ffd23f;z-index:1}
button{font-size:1.1rem;padding:14px 28px;border:0;border-radius:12px;background:#ff5d8f;color:#fff;font-weight:700;min-height:48px;cursor:pointer}
button:disabled{opacity:.5}
#spin{margin:16px 0 8px;width:min(90vw,380px)}
#result{min-height:2em;font-size:1.4rem;font-weight:700;color:#ffd23f;text-align:center}
.edit{width:min(90vw,380px);margin-top:12px}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;font-size:1rem;padding:12px;border-radius:10px;border:0;min-height:48px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;background:#2c2250;border-radius:10px;padding:8px 12px;margin-bottom:6px}
li button{padding:8px 14px;font-size:.9rem;background:#5a4a8a;min-height:40px}
</style>
</head>
<body>
<h1>Snack Picker Wheel</h1>
<div class="wrap"><div class="pointer"></div><canvas id="wheel" width="760" height="760"></canvas></div>
<button id="spin">SPIN</button>
<div id="result"></div>
<div class="edit">
  <div class="row"><input id="newItem" placeholder="Add a snack" maxlength="24"><button id="add">Add</button></div>
  <ul id="list"></ul>
</div>
<script>
(function(){
var KEY='b18-snacks',items;
try{items=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(items)||items.length<2)items=['Nachos','Popcorn','Pretzels','Chips','Cookies','Fruit'];
var colors=['#ff5d8f','#ffb703','#3bceac','#0ead69','#7b2cbf','#ee4266','#4d9de0','#f49d37'];
var c=document.getElementById('wheel'),ctx=c.getContext('2d'),angle=0,spinning=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function draw(){
  var n=items.length,r=c.width/2,seg=2*Math.PI/n;
  ctx.clearRect(0,0,c.width,c.height);
  for(var i=0;i<n;i++){
    var a=angle+i*seg;
    ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-4,a,a+seg);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ctx.save();ctx.translate(r,r);ctx.rotate(a+seg/2);
    ctx.fillStyle='#fff';ctx.font='bold 34px system-ui,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(items[i],r-24,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(r,r,30,0,2*Math.PI);ctx.fillStyle='#1b1430';ctx.fill();
}
function render(){
  var ul=document.getElementById('list');ul.innerHTML='';
  items.forEach(function(it,i){
    var li=document.createElement('li'),s=document.createElement('span'),b=document.createElement('button');
    s.textContent=it;b.textContent='Remove';
    b.onclick=function(){if(spinning)return;if(items.length<=2){alert('Keep at least 2 snacks');return}items.splice(i,1);save();render();draw()};
    li.appendChild(s);li.appendChild(b);ul.appendChild(li);
  });
}
function add(){var inp=document.getElementById('newItem'),v=inp.value.trim();if(!v||spinning)return;items.push(v);inp.value='';save();render();draw()}
document.getElementById('add').onclick=add;
document.getElementById('newItem').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
document.getElementById('spin').onclick=function(){
  if(spinning)return;spinning=true;var btn=this;btn.disabled=true;
  document.getElementById('result').textContent='';
  var start=angle,total=Math.PI*2*(5+Math.random()*3),dur=4000,t0=null;
  function step(ts){
    if(t0===null)t0=ts;var p=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-p,3);
    angle=start+total*e;draw();
    if(p<1){requestAnimationFrame(step);return}
    angle%=2*Math.PI;spinning=false;btn.disabled=false;
    var n=items.length,seg=2*Math.PI/n,pt=(3*Math.PI/2-angle)%(2*Math.PI);if(pt<0)pt+=2*Math.PI;
    document.getElementById('result').textContent='You got: '+items[Math.floor(pt/seg)%n]+'!';
  }
  requestAnimationFrame(step);
};
render();draw();
})();
</script>
</body>
</html>
