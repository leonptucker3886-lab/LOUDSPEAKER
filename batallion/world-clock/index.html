<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock Board</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#f5f5f5}
h1{text-align:center;margin:16px 8px;font-size:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:12px;max-width:1100px;margin:auto}
.card{background:#1d1d1d;border-radius:12px;padding:16px;position:relative}
.city{font-size:1.1rem;opacity:.8}.time{font-size:2.4rem;font-variant-numeric:tabular-nums;margin:6px 0}
.date{opacity:.6}.rm{position:absolute;top:8px;right:8px;background:none;border:0;color:#aaa;font-size:1.4rem;min-width:44px;min-height:44px}
form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px}
select,button{font-size:1rem;padding:12px;border-radius:8px;border:0;min-height:44px}
button.add{background:#2A78D6;color:#fff}
</style></head><body>
<h1>World Clock Board</h1>
<form id="f"><select id="z"></select><button class="add" type="submit">Add city</button><button type="button" id="h">12/24h</button></form>
<div class="grid" id="g"></div>
<script>
var ZONES=["America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Sao_Paulo","Europe/London","Europe/Paris","Europe/Berlin","Africa/Lagos","Africa/Johannesburg","Asia/Dubai","Asia/Kolkata","Asia/Shanghai","Asia/Tokyo","Asia/Singapore","Australia/Sydney","Pacific/Auckland","UTC"];
var KEY="b11-world-clock";var s=JSON.parse(localStorage.getItem(KEY)||"null")||{zones:["America/New_York","Europe/London","Asia/Tokyo"],h12:true};
var z=document.getElementById("z");ZONES.forEach(function(t){var o=document.createElement("option");o.value=t;o.textContent=t.split("/").pop().replace(/_/g," ");z.appendChild(o)});
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function render(){var g=document.getElementById("g");g.innerHTML="";var n=new Date();
s.zones.forEach(function(t,i){var c=document.createElement("div");c.className="card";
c.innerHTML='<button class="rm" aria-label="Remove">&times;</button><div class="city"></div><div class="time"></div><div class="date"></div>';
c.querySelector(".city").textContent=t.split("/").pop().replace(/_/g," ");
c.querySelector(".time").textContent=n.toLocaleTimeString([], {timeZone:t,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:s.h12});
c.querySelector(".date").textContent=n.toLocaleDateString([], {timeZone:t,weekday:"short",month:"short",day:"numeric"});
c.querySelector(".rm").onclick=function(){s.zones.splice(i,1);save();render()};g.appendChild(c)})}
document.getElementById("f").onsubmit=function(e){e.preventDefault();if(s.zones.indexOf(z.value)<0){s.zones.push(z.value);save();render()}};
document.getElementById("h").onclick=function(){s.h12=!s.h12;save();render()};
render();setInterval(render,1000);
</script></body></html>
