<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B19 Tarot-style Card Draw</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1b1030;color:#f3e9ff;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
button{background:#7b4bd6;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
.spread{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:560px}
.card{width:150px;height:230px;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;text-align:center}
.back{background:repeating-linear-gradient(45deg,#3a2270,#3a2270 8px,#4d2d91 8px,#4d2d91 16px);border:2px solid #c9a6ff;font-size:2rem}
.front{background:#fff8e7;color:#2a1a40;transform:rotateY(180deg);border:2px solid #d4af37}
.front .sym{font-size:2.4rem}.front .nm{font-weight:700;margin:6px 0}.front .mn{font-size:.8rem}
.rev .sym{transform:rotate(180deg)}
.pos{font-size:.75rem;opacity:.8;margin-top:4px;text-align:center}
</style></head><body>
<h1>🔮 Tarot-style Card Draw</h1>
<div class="row"><button id="d1">Draw 1</button><button id="d3">Draw 3 (Past · Present · Future)</button></div>
<div class="spread" id="spread"></div>
<p style="font-size:.8rem;opacity:.7">Tap a card to reveal it. For fun only.</p>
<script>
const deck=[["The Fool","🃏","New beginnings, spontaneity","Recklessness, hesitation"],["The Magician","🪄","Skill, willpower","Manipulation, untapped talent"],["The High Priestess","🌙","Intuition, mystery","Secrets, disconnection"],["The Empress","🌸","Abundance, nurturing","Dependence, creative block"],["The Emperor","👑","Structure, authority","Rigidity, control"],["The Lovers","💞","Harmony, choices","Imbalance, misalignment"],["The Chariot","🏇","Determination, victory","Lack of direction"],["Strength","🦁","Courage, patience","Self-doubt"],["The Hermit","🏮","Reflection, solitude","Isolation"],["Wheel of Fortune","🎡","Change, cycles","Bad luck, resistance"],["Justice","⚖️","Fairness, truth","Unfairness"],["The Star","⭐","Hope, renewal","Despair"],["The Moon","🌕","Illusion, dreams","Confusion lifting"],["The Sun","☀️","Joy, success","Temporary gloom"],["The World","🌍","Completion","Loose ends"]];
function draw(n){const s=document.getElementById('spread');s.innerHTML='';const pool=[...deck].sort(()=>Math.random()-.5);const labels=n===3?["Past","Present","Future"]:["Your card"];
for(let i=0;i<n;i++){const[c,sym,up,rv]=pool[i];const r=Math.random()<.3;const w=document.createElement('div');
w.innerHTML=`<div class="card"><div class="inner"><div class="face back">✦</div><div class="face front ${r?'rev':''}"><div class="sym">${sym}</div><div class="nm">${c}${r?' (Reversed)':''}</div><div class="mn">${r?rv:up}</div></div></div></div><div class="pos">${labels[i]}</div>`;
w.querySelector('.card').onclick=e=>e.currentTarget.classList.toggle('flipped');s.appendChild(w);}}
d1.onclick=()=>draw(1);d3.onclick=()=>draw(3);draw(3);
</script></body></html>
