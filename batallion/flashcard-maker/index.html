<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>B06 Flashcard Maker</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f7;color:#18181b}main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:1.4rem}
input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;margin:4px 0}button{background:#2a78d6;color:#fff;border:0;cursor:pointer}
.row{display:flex;gap:8px}.row>*{flex:1}.card{perspective:800px;height:200px;margin:12px 0;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;background:#fff;border-radius:12px;box-shadow:0 2px 8px #0002;font-size:1.2rem}
.back{transform:rotateY(180deg);background:#eef5ff}.muted{color:#666;font-size:.9rem;text-align:center}ul{padding-left:18px}li button{width:auto;padding:2px 8px;background:#c33;margin-left:6px}</style></head>
<body><main><h1>Flashcard Maker</h1>
<div class="row"><select id="deck"></select><button id="newDeck">New deck</button></div>
<input id="front" placeholder="Front (question)"><textarea id="back" rows="2" placeholder="Back (answer)"></textarea><button id="add">Add card</button>
<div class="card" id="card"><div class="inner"><div class="face" id="f">Add cards to start</div><div class="face back" id="b"></div></div></div>
<p class="muted" id="pos">Tap card to flip</p>
<div class="row"><button id="prev">Prev</button><button id="shuf">Shuffle</button><button id="next">Next</button></div>
<ul id="list"></ul></main>
<script>
const K='b06-flashcards';let s=JSON.parse(localStorage.getItem(K)||'null')||{cur:'Default',decks:{Default:[]}};let i=0;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(s)),d=()=>s.decks[s.cur];
function render(){$('deck').innerHTML=Object.keys(s.decks).map(n=>'<option'+(n===s.cur?' selected':'')+'>'+n.replace(/</g,'&lt;')+'</option>').join('');
const c=d();if(i>=c.length)i=0;$('card').classList.remove('flip');$('f').textContent=c.length?c[i].f:'Add cards to start';$('b').textContent=c.length?c[i].b:'';
$('pos').textContent=c.length?`Card ${i+1} of ${c.length} · tap to flip`:'No cards yet';$('list').innerHTML='';
c.forEach((x,j)=>{const li=document.createElement('li');li.textContent=x.f+' — '+x.b;const r=document.createElement('button');r.textContent='×';r.onclick=()=>{c.splice(j,1);save();render()};li.appendChild(r);$('list').appendChild(li)})}
$('newDeck').onclick=()=>{const n=(prompt('Deck name')||'').trim();if(n&&!s.decks[n]){s.decks[n]=[];s.cur=n;i=0;save();render()}};
$('deck').onchange=e=>{s.cur=e.target.value;i=0;save();render()};
$('add').onclick=()=>{const f=$('front').value.trim(),b=$('back').value.trim();if(!f||!b)return;d().push({f,b});$('front').value=$('back').value='';i=d().length-1;save();render()};
$('card').onclick=()=>$('card').classList.toggle('flip');
$('next').onclick=()=>{if(d().length){i=(i+1)%d().length;render()}};$('prev').onclick=()=>{if(d().length){i=(i-1+d().length)%d().length;render()}};
$('shuf').onclick=()=>{const c=d();for(let j=c.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[c[j],c[k]]=[c[k],c[j]]}i=0;save();render()};
render();
</script></body></html>
