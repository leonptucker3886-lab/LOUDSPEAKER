<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#2d6a4f;color:#fff;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:16px;text-align:center}
h1{margin:8px 0}.bar{display:flex;justify-content:space-between;font-size:18px;margin:8px 0}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;touch-action:manipulation}
.hole{aspect-ratio:1;background:#40261a;border-radius:50%;position:relative;overflow:hidden;cursor:pointer;user-select:none}
.mole{position:absolute;left:15%;width:70%;height:70%;bottom:-75%;background:#8b5a2b;border-radius:50% 50% 40% 40%;transition:bottom .12s;font-size:2.2em;display:flex;align-items:center;justify-content:center}
.hole.up .mole{bottom:5%}.hole.hit .mole{background:#c0392b}
button{font-size:18px;padding:10px 24px;border:0;border-radius:8px;background:#ffd166;color:#222;cursor:pointer}
</style></head><body><main>
<h1>Whack-a-Mole</h1>
<div class="bar"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">30</b>s</span><span>Best: <b id="best">0</b></span></div>
<div id="grid"></div>
<button id="start">Start</button>
<p id="msg">Tap or click the moles. 30-second round.</p>
</main><script>
const grid=document.getElementById('grid'),sE=document.getElementById('score'),tE=document.getElementById('time'),bE=document.getElementById('best'),msg=document.getElementById('msg'),btn=document.getElementById('start');
const KEY='wam-best';let best=+localStorage.getItem(KEY)||0;bE.textContent=best;
const holes=[];for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.innerHTML='<div class="mole">🐹</div>';h.addEventListener('pointerdown',e=>{e.preventDefault();whack(h)});grid.appendChild(h);holes.push(h)}
let score=0,left=0,playing=false,timer=null,popT=null;
function whack(h){if(!playing||!h.classList.contains('up'))return;score++;sE.textContent=score;h.classList.add('hit');h.classList.remove('up');setTimeout(()=>h.classList.remove('hit'),150)}
function pop(){if(!playing)return;const free=holes.filter(h=>!h.classList.contains('up'));if(free.length){const h=free[Math.floor(Math.random()*free.length)];h.classList.add('up');setTimeout(()=>h.classList.remove('up'),Math.max(450,1000-score*15))}popT=setTimeout(pop,Math.max(350,800-score*10))}
function start(){score=0;left=30;sE.textContent=0;tE.textContent=30;playing=true;btn.disabled=true;msg.textContent='Go!';pop();timer=setInterval(()=>{left--;tE.textContent=left;if(left<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);clearTimeout(popT);holes.forEach(h=>h.classList.remove('up'));btn.disabled=false;btn.textContent='Play again';if(score>best){best=score;localStorage.setItem(KEY,best);bE.textContent=best;msg.textContent='New high score: '+score+'!'}else msg.textContent='Score: '+score}
btn.addEventListener('click',start);
</script></body></html>
