<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B08 · Color Mixer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f4;color:#18181b}
main{max-width:560px;margin:0 auto;padding:20px}h1{font-size:1.5rem;margin:0 0 16px}
.row{display:flex;gap:12px}.pick{flex:1;background:#fff;border-radius:12px;padding:12px;text-align:center}
input[type=color]{width:100%;height:80px;border:0;padding:0;background:none;cursor:pointer}
label{display:block;font-weight:600;margin-bottom:6px}
.slider{background:#fff;border-radius:12px;padding:12px;margin:12px 0}input[type=range]{width:100%}
#result{height:140px;border-radius:12px;margin:12px 0;border:1px solid #ddd}
.codes{background:#fff;border-radius:12px;padding:12px}.code{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-family:ui-monospace,monospace;font-size:1rem}
button{padding:10px 14px;border:0;border-radius:8px;background:#2a78d6;color:#fff;font-weight:600;cursor:pointer;min-width:72px}
#msg{min-height:1.2em;text-align:center;color:#008300;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Color Mixer</h1>
<div class="row">
<div class="pick"><label for="c1">Color A</label><input type="color" id="c1" value="#ff0000"></div>
<div class="pick"><label for="c2">Color B</label><input type="color" id="c2" value="#0000ff"></div>
</div>
<div class="slider"><label for="mix">Mix: <span id="pct">50</span>% B</label><input type="range" id="mix" min="0" max="100" value="50"></div>
<div id="result" aria-label="Mixed color"></div>
<div class="codes">
<div class="code"><span id="hex"></span><button data-t="hex">Copy</button></div>
<div class="code"><span id="rgb"></span><button data-t="rgb">Copy</button></div>
</div>
<div id="msg" role="status"></div>
</main>
<script>
(function(){
var c1=document.getElementById('c1'),c2=document.getElementById('c2'),mix=document.getElementById('mix');
function toRgb(h){return[1,3,5].map(function(i){return parseInt(h.substr(i,2),16);});}
function hx(n){return n.toString(16).padStart(2,'0');}
function update(){var a=toRgb(c1.value),b=toRgb(c2.value),t=mix.value/100;
var m=a.map(function(v,i){return Math.round(v*(1-t)+b[i]*t);});
var hex=('#'+m.map(hx).join('')).toUpperCase(),rgb='rgb('+m.join(', ')+')';
document.getElementById('result').style.background=hex;
document.getElementById('hex').textContent=hex;document.getElementById('rgb').textContent=rgb;
document.getElementById('pct').textContent=mix.value;}
function copy(text){var msg=document.getElementById('msg');
function ok(){msg.textContent='Copied '+text;}
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fb);}else fb();
function fb(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){msg.textContent='Copy failed';}document.body.removeChild(ta);}}
[c1,c2,mix].forEach(function(el){el.addEventListener('input',update);});
document.querySelectorAll('button[data-t]').forEach(function(b){b.addEventListener('click',function(){copy(document.getElementById(b.dataset.t).textContent);});});
update();})();
</script>
</body>
</html>
