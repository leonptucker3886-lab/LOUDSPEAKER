<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery List</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7f4;color:#1b1b1f}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:1.6rem;margin:0 0 12px}
form{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;padding:12px;font-size:1rem;border:1px solid #ccd;border-radius:10px}
button{padding:12px 14px;font-size:1rem;border:0;border-radius:10px;background:#2a7d3f;color:#fff;cursor:pointer}
button.ghost{background:#e4e7e2;color:#1b1b1f}
ul{list-style:none;padding:0;margin:0}
li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
li input{width:22px;height:22px}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:#888}
li button{background:#c0392b;padding:6px 10px;font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#555}
.empty{color:#777;text-align:center;padding:20px}
</style>
</head>
<body>
<main>
<h1>🛒 Grocery List</h1>
<form id="f"><input type="text" id="t" placeholder="Add an item…" aria-label="Item" autocomplete="off"><button type="submit">Add</button></form>
<ul id="list"></ul>
<p class="empty" id="empty">No items yet.</p>
<div class="bar"><span id="count"></span><button class="ghost" id="clr" type="button">Clear checked</button></div>
</main>
<script>
(function(){
var KEY='grocery-list-v1',items=[];
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}
var list=document.getElementById('list'),t=document.getElementById('t');
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function render(){
list.innerHTML='';
items.forEach(function(it,i){
var li=document.createElement('li');if(it.done)li.className='done';
var c=document.createElement('input');c.type='checkbox';c.checked=it.done;c.setAttribute('aria-label','Check '+it.text);
c.onchange=function(){it.done=c.checked;save();render()};
var s=document.createElement('span');s.textContent=it.text;
var b=document.createElement('button');b.type='button';b.textContent='Remove';
b.onclick=function(){items.splice(i,1);save();render()};
li.append(c,s,b);list.appendChild(li);
});
var left=items.filter(function(x){return !x.done}).length;
document.getElementById('count').textContent=left+' of '+items.length+' left';
document.getElementById('empty').style.display=items.length?'none':'block';
}
document.getElementById('f').onsubmit=function(e){e.preventDefault();var v=t.value.trim();if(!v)return;items.push({text:v,done:false});t.value='';save();render();t.focus()};
document.getElementById('clr').onclick=function(){items=items.filter(function(x){return !x.done});save();render()};
render();
})();
</script>
</body>
</html>
