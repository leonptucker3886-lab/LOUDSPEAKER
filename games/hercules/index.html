<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>G08 Snake Variant - Hercules</title>
<style>body{background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center}canvas{background:#222;border:2px solid #555;touch-action:none}</style></head>
<body><h1>Snake: Wrap Mode</h1><p>Arrows/WASD or swipe. Walls wrap; gold food = +3 &amp; speed up. <span id="s">Score 0</span></p><canvas id="c" width="400" height="400"></canvas><p><button onclick="reset()">Restart</button></p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20;let sn,d,nd,f,g,sc,sp,t,over;
function rnd(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(q=>q.x==p.x&&q.y==p.y));return p}
function reset(){sn=[{x:10,y:10}];d=nd={x:1,y:0};sc=0;sp=150;over=false;f=rnd();g=null;clearTimeout(t);loop()}
function loop(){d=nd;let h={x:(sn[0].x+d.x+N)%N,y:(sn[0].y+d.y+N)%N};
if(sn.some(q=>q.x==h.x&&q.y==h.y)){over=true;draw();return}
sn.unshift(h);let grow=0;
if(h.x==f.x&&h.y==f.y){sc++;grow=1;f=rnd();if(Math.random()<.25&&!g)g=rnd()}
else if(g&&h.x==g.x&&h.y==g.y){sc+=3;grow=3;g=null;sp=Math.max(60,sp-10)}
if(!grow)sn.pop();else for(let i=1;i<grow;i++)sn.push({...sn[sn.length-1]});
draw();t=setTimeout(loop,sp)}
function draw(){x.fillStyle='#222';x.fillRect(0,0,400,400);x.fillStyle='#e33';x.fillRect(f.x*S,f.y*S,S-1,S-1);
if(g){x.fillStyle='#fc0';x.fillRect(g.x*S,g.y*S,S-1,S-1)}x.fillStyle='#4c4';sn.forEach(p=>x.fillRect(p.x*S,p.y*S,S-1,S-1));
document.getElementById('s').textContent='Score '+sc;if(over){x.fillStyle='#fff';x.font='30px sans-serif';x.fillText('Game Over',125,200)}}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
function turn(a,b){if(a!=-d.x||b!=-d.y)nd={x:a,y:b}}
onkeydown=e=>{let k=K[e.key];if(k){e.preventDefault();turn(...k)}};
let sx,sy;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))};
reset();
</script></body></html>
