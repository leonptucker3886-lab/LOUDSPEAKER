<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>
<style>
body{margin:0;background:#05010f;color:#e0f;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{color:#0ff;text-shadow:0 0 12px #0ff;margin:12px 0 4px}
#hud{display:flex;gap:20px;margin-bottom:8px}
canvas{border:2px solid #f0f;box-shadow:0 0 18px #f0f;max-width:94vw;touch-action:none;background:#0a0420}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin:12px}
button{min-height:48px;min-width:48px;background:#120632;color:#0ff;border:1px solid #0ff;border-radius:8px;font-size:20px}
</style></head><body>
<h1>NEON SNAKE</h1>
<div id="hud"><span>Score: <b id="s">0</b></span><span>Best: <b id="b">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div class="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button id="p">⏯</button><button data-d="1,0">▶</button><span></span><button data-d="0,1">▼</button><span></span></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20;
let sn,d,nd,f,sc,run,best=+localStorage.neonSnakeBest||0;b.textContent=best;
function reset(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];d={x:1,y:0};nd=d;sc=0;s.textContent=0;food();run=true}
function food(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(p=>p.x==f.x&&p.y==f.y))}
function turn(a,b2){if(a==-d.x&&b2==-d.y)return;nd={x:a,y:b2}}
function step(){if(!run)return;d=nd;const h={x:(sn[0].x+d.x+N)%N,y:(sn[0].y+d.y+N)%N};
if(sn.some(p=>p.x==h.x&&p.y==h.y)){run=false;if(sc>best){best=sc;localStorage.neonSnakeBest=best;b.textContent=best}draw();x.fillStyle='#f0f';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('GAME OVER – tap ⏯',200,200);return}
sn.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;s.textContent=sc;food()}else sn.pop();draw()}
function draw(){x.fillStyle='#0a0420';x.fillRect(0,0,400,400);x.shadowBlur=14;x.shadowColor='#f0f';x.fillStyle='#f0f';x.fillRect(f.x*S+3,f.y*S+3,S-6,S-6);
x.shadowColor='#0ff';sn.forEach((p,i)=>{x.fillStyle=i?'#0cc':'#0ff';x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});x.shadowBlur=0}
document.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m){e.preventDefault();turn(...m)}if(e.key==' '){run?run=false:(sn&&sn.length&&!gameOver()?run=true:reset())}});
function gameOver(){const h=sn[0];return sn.slice(1).some(p=>p.x==h.x&&p.y==h.y)}
document.querySelectorAll('[data-d]').forEach(bt=>bt.onclick=()=>turn(...bt.dataset.d.split(',').map(Number)));
p.onclick=()=>{run?run=false:(gameOver()?reset():run=true)};
let tx,ty;c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)+Math.abs(dy)<20)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
reset();draw();setInterval(step,110);
</script></body></html>
